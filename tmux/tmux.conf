bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one
bind-key -r -T prefix       M-k              resize-pane -U 5
bind-key -r -T prefix       M-j            resize-pane -D 5
bind-key -r -T prefix       M-h            resize-pane -L 5
bind-key -r -T prefix       M-l           resize-pane -R 5
bind-key -r -T prefix       C-k              resize-pane -U
bind-key -r -T prefix       C-j            resize-pane -D
bind-key -r -T prefix       C-h            resize-pane -L
bind-key -r -T prefix       C-l           resize-pane -R
unbind-key C-r

# Key bindings when in scroll mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
set -g set-clipboard on

# Edit tmux file with <prefix>+M and reload config with <prefix>+r
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"
bind-key e new-window -n "~/.tmux.conf" "nvim ~/.tmux.conf"

# Native session picker sorted alphabetically to match Line 0 status tabs
bind-key s choose-tree -Zs -O name

set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

set -g escape-time 10
set -g repeat-time 600
set -g focus-events on

# THEME
#contant
left_content="❐ WINDOWS "
window_content="#I #W"

# seperators
# Powerline fonts needed
left_seperator=""
left_separator_sub=""
right_seperator=""
right_seperator_sub=""

# colors
background_main="#44475a"
text_main="#ffffff"

left_color="#ffff00"
left_color_secondary="#00ff22"
left_text="#000000"
left_text_secondary="#000000"

window_color="#00ffff"
window_text="#000000"

right_color="#ff7500"
right_text="#000000"
right_color_secondary="#ff0000"
right_text_secondary="#ffffff"
right_color_third="#ffffff"
right_text_third="#000000"

time_zone="America/Los_Angeles"

set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g pane-border-style fg='#44475a'
set -g pane-active-border-style fg='#00ff22'
set -g pane-border-lines heavy
set -g pane-border-indicators both
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#000000]#[bg=#00ff22]#[bold] #{?#{==:#{@p_agent},question},#[fg=#8b2500] #[fg=#000000],#{?#{||:#{==:#{@p_agent},done},#{==:#{@p_agent},1}},#[fg=#004d22] #[fg=#000000],#{?#{==:#{@p_agent},running},#[fg=#004488] #[fg=#000000],#{?#{==:#{@p_bell},1},#[fg=#6b3a00] #[fg=#000000],}}}}#{pane_index}: #{pane_current_command} [#{b:pane_current_path}] #[default],#[fg=#ffffff]#[bg=#44475a] #{?#{==:#{@p_agent},question},#[fg=#ffb86c] #[fg=#ffffff],#{?#{||:#{==:#{@p_agent},done},#{==:#{@p_agent},1}},#[fg=#50fa7b] #[fg=#ffffff],#{?#{==:#{@p_agent},running},#[fg=#8be9fd] #[fg=#ffffff],#{?#{==:#{@p_bell},1},#[fg=#f1fa8c] #[fg=#ffffff],}}}}#{pane_index}: #{pane_current_command} [#{b:pane_current_path}] #[default]}"

# Dim inactive panes while preserving full background transparency
set -g window-style 'fg=#6272a4,bg=default'
set -g window-active-style 'fg=#ffffff,bg=default'

set -g message-style bg=$background_main,fg='#fffffF'

# Status Bar Configuration
set -g status-style bg=$background_main,fg='#fffffF'
set -g status-interval 1
set -g status-position top

# Bell and Alert Monitoring
set -g bell-action any
setw -g monitor-bell on
setw -g monitor-activity off
set -g visual-bell off
set -g visual-activity off

# 2-line status bar:
# Line 0 (Top line): "SESSIONS Badge > Open Workspaces > < Extensions / System Info"
# Line 1 (Bottom line): "WINDOWS Badge > Windows > < Informative"
set -g status 2
set -g "status-format[0]" "#[align=left]#[fg=$left_text]#[bg=$left_color]#[bold]#{?client_prefix,#[fg=$left_text_secondary]#[bg=$left_color_secondary],} ❒ SESSIONS #[nobold]#[bg=$background_main]#[fg=$left_color]#{?client_prefix,#[fg=$left_color_secondary],}$left_seperator #{E:@session_tabs_fmt}#(~/.dotconfigs/tmux/session_tabs.sh --reap)#[nolist align=right range=right]#(~/.dotconfigs/tmux/top_right_info.sh)#[norange default]"
set -g "status-format[1]" "#[align=left range=left #{status-left-style}]#{T;=/#{status-left-length}:status-left}#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{T:window-status-style}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{T:window-status-current-style},#{T:window-status-style}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange default]#{?window_end_flag,,#{window-status-separator}}}#[nolist align=right range=right #{status-right-style}]#{T;=/#{status-right-length}:status-right}#[norange default]"

set -g status-left-length 50
set -g status-left "#[bg=$left_color]#[fg=$left_text]#{?client_prefix,#[bg=$left_color_secondary]#[fg=$left_text_secondary],} $left_content #[bg=$background_main]#[fg=$left_color]#{?client_prefix,#[fg=$left_color_secondary],}$left_seperator "

# Pane-level Focus, Window & Session Sync Hooks
set-hook -g pane-focus-in 'run-shell -b "~/.dotconfigs/tmux/agents/agent_hook.sh focus_pane #{pane_id} >/dev/null 2>&1"'
set-hook -g after-select-pane 'run-shell -b "~/.dotconfigs/tmux/agents/agent_hook.sh focus_pane #{pane_id} >/dev/null 2>&1"'
set-hook -g after-select-window 'run-shell -b "~/.dotconfigs/tmux/agents/agent_hook.sh focus_pane #{pane_id} >/dev/null 2>&1"'
set-hook -g client-session-changed 'run-shell -b "~/.dotconfigs/tmux/agents/agent_hook.sh focus_pane #{pane_id} >/dev/null 2>&1"'
set-hook -g client-attached 'run-shell -b "~/.dotconfigs/tmux/agents/agent_hook.sh focus_pane #{pane_id} >/dev/null 2>&1"'
set-hook -g pane-exited 'run-shell -b "~/.dotconfigs/tmux/agents/agent_hook.sh pane_exited #{hook_pane} >/dev/null 2>&1"'
set-hook -g after-kill-pane 'run-shell -b "~/.dotconfigs/tmux/agents/agent_hook.sh pane_exited >/dev/null 2>&1"'
set-hook -g session-created 'run-shell -b "~/.dotconfigs/tmux/session_tabs.sh --sync >/dev/null 2>&1"'
set-hook -g session-closed 'run-shell -b "~/.dotconfigs/tmux/session_tabs.sh --sync >/dev/null 2>&1"'
set-hook -g session-renamed 'run-shell -b "~/.dotconfigs/tmux/session_tabs.sh --sync >/dev/null 2>&1"'
set-hook -g window-linked 'run-shell -b "~/.dotconfigs/tmux/session_tabs.sh --sync >/dev/null 2>&1"'
set-hook -g window-unlinked 'run-shell -b "~/.dotconfigs/tmux/session_tabs.sh --sync >/dev/null 2>&1"'
set-hook -g alert-bell 'run-shell -b "~/.dotconfigs/tmux/session_tabs.sh --sync >/dev/null 2>&1"'
set-hook -g alert-activity 'run-shell -b "~/.dotconfigs/tmux/session_tabs.sh --sync >/dev/null 2>&1"'
set-hook -g alert-silence 'run-shell -b "~/.dotconfigs/tmux/session_tabs.sh --sync >/dev/null 2>&1"'
run-shell -b "~/.dotconfigs/tmux/agents/agent_hook.sh sync_window >/dev/null 2>&1"

set-window-option -g window-status-style fg=default,bg=default
set-window-option -g window-status-current-style fg="$window_text",bg="$window_color"
set-window-option -g window-status-separator ""

set -g window-status-current-format "#[fg=$background_main]#[bg=$window_color]$left_seperator#[fg=$window_text]#[bg=$window_color]#{?#{==:#{@w_agent},question}, #[fg=#8b2500]#[bold]#[nobold]#[fg=$window_text],#{?#{||:#{==:#{@w_agent},done},#{==:#{@w_agent},1}}, #[fg=#004d22]#[bold]#[nobold]#[fg=$window_text],#{?#{==:#{@w_agent},running}, #[fg=#004488]#[bold]#[nobold]#[fg=$window_text],#{?#{==:#{@w_bell},1}, #[fg=#6b3a00]#[bold]#[nobold]#[fg=$window_text],#{?#{&&:#{!=:#{window_alerts},},#{!=:#{window_alerts},!}}, #[fg=#990000]#[bold]#[nobold]#[fg=$window_text],}}}}}#{?window_zoomed_flag, #[fg=#4a0072]#[bold]#[nobold]#[fg=$window_text],} $window_content #[fg=$window_color]#[bg=$background_main]$left_seperator"
set -g window-status-format "#{?window_start_flag,,#{?#{==:#{e|-:#{window_index},1},#{active_window_index}},,#[fg=$text_main]#[bg=$background_main]$left_separator_sub }}#[fg=$text_main]#[bg=$background_main]#{?#{==:#{@w_agent},question}, #[fg=#ffb86c]#[fg=$text_main],#{?#{||:#{==:#{@w_agent},done},#{==:#{@w_agent},1}}, #[fg=#50fa7b]#[fg=$text_main],#{?#{==:#{@w_agent},running}, #[fg=#8be9fd]#[fg=$text_main],#{?#{||:#{==:#{@w_bell},1},#{window_bell_flag}}, #[fg=#f1fa8c]#[fg=$text_main],#{?#{!=:#{window_alerts},}, #[fg=#ff5555]#[fg=$text_main],}}}}}#{?window_zoomed_flag, #[fg=#bd93f9]#[fg=$text_main],} $window_content "

set -g status-right-length 80
set -g status-right "#[fg=$text_main,bg=$background_main]$right_seperator_sub#[fg=$text_main,bg=$background_main] #(TZ="$time_zone" date +%%H:%%M) "
set -ga status-right "#[fg=$text_main,bg=$background_main]$right_seperator_sub#[fg=$text_main,bg=$background_main] #(TZ="$time_zone" date '+%%a %%d %%b') "
set -ga status-right "#[fg=$right_color,bg=$background_main]$right_seperator#[fg=$right_text,bg=$right_color] #(uname -s) "
set -ga status-right "#[fg=$right_color_secondary,bg=$right_color]$right_seperator#[fg=$right_text_secondary,bg=$right_color_secondary] #(whoami) "
set -ga status-right "#[fg=$right_color_third,bg=$right_color_secondary]$right_seperator#[fg=$right_text_third,bg=$right_color_third] #h "

# Session persistence: tmux-resurrect (save/restore) + tmux-continuum (auto-save every 15 min, restore on server start)
# prefix + C-s saves, prefix + C-r restores
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# Agent panes: relaunch via agents/<cli>/resume.sh, which resumes the session ID the pane held
# (agents/antigravity/resume.sh [command [data_dir]] accepts a custom wrapper or data path)
set -g @resurrect-processes '"claude->~/.dotconfigs/tmux/agents/claude/resume.sh" "agy->~/.dotconfigs/tmux/agents/antigravity/resume.sh"'
set -g @resurrect-hook-post-save-all '~/.dotconfigs/tmux/agents/claude/sessions_save.sh; ~/.dotconfigs/tmux/agents/antigravity/sessions_save.sh'

# Machine-specific bindings and overrides (gitignored, optional). Sourced after the settings
# above so it can extend them, e.g. set -ga @resurrect-processes ' "~agy-wrapper->..."'
source-file -q ~/.dotconfigs/tmux/local.conf

# Keep at the very bottom
run '~/.tmux/plugins/tpm/tpm'
